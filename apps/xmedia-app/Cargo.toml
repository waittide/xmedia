[package]
name = "xmedia-app"
version = "0.1.0"
description = "XMedia standalone cross-platform client powered by Tauri v2"
edition = "2024"
license = "MIT"

[lib]
name = "xmedia_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "xmedia-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
axum = "0.8"
bytes = "1"
form_urlencoded = "1.2"
futures-util = "0.3"
hex = "0.4"
md-5 = "0.11"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = ["image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
xmedia = { path = "../../crates/xmedia" }
xmedia-core = { path = "../../crates/xmedia-core" }

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
