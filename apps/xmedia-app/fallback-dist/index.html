<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6faff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
    <title>XMedia</title>
    <style>
      :root {
        color-scheme: light dark;
        --md-sys-color-surface: #f6faff;
        --md-sys-color-on-surface: #191c1f;
        --md-sys-color-on-surface-variant: #414751;
        --md-sys-color-primary: #315da8;
        --md-sys-color-secondary-container: #d5e3fb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --md-sys-color-surface: #111317;
          --md-sys-color-on-surface: #dfe3e8;
          --md-sys-color-on-surface-variant: #c0c7d3;
          --md-sys-color-primary: #a7c8ff;
          --md-sys-color-secondary-container: #3c475a;
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        display: grid;
        place-items: center;
        background: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      .bar {
        position: relative;
        width: 12rem;
        height: 4px;
        overflow: hidden;
        border-radius: 9999px;
        background: var(--md-sys-color-secondary-container);
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: 9999px;
        background: var(--md-sys-color-primary);
        animation: slide 1.4s cubic-bezier(0.2, 0, 0, 1) infinite;
      }
      .label {
        margin: 0;
        color: var(--md-sys-color-on-surface-variant);
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          width: 100%;
          opacity: 0.55;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" role="status" aria-live="polite">
      <div class="bar" aria-hidden="true"></div>
      <p class="label">Starting XMedia local engine…</p>
    </main>
  </body>
</html>
