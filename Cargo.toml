[workspace]
resolver = "3"
members = [
    "crates/xmedia-core",
    "crates/xmedia-book",
    "crates/xmedia-comic",
    "crates/xmedia-music",
    "crates/xmedia-video",
    "crates/xmedia",
    "crates/xmedia-tool",
]
exclude = ["apps/xmedia-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
xmedia-core = { path = "crates/xmedia-core" }
xmedia-book = { path = "crates/xmedia-book" }
xmedia-comic = { path = "crates/xmedia-comic" }
xmedia-music = { path = "crates/xmedia-music" }
xmedia-video = { path = "crates/xmedia-video" }

aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["alloc", "getrandom"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1.12.1"
chardetng = "1.0.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
encoding_rs = "0.8.44"
flate2 = "1.1.11"
form_urlencoded = "1.2.2"
futures-core = "0.3.32"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
jiff = { version = "0.2.43", features = ["serde"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
lofty = "0.25.5"
lopdf = "0.47.0"
md-5 = "0.11.0"
mime_guess = "2.0.5"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "socks", "blocking"] }
rquickjs = "0.14.0"
rust-embed = { version = "8.14.0", features = ["interpolate-folder-path"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toasty = { version = "0.11.0", features = ["sqlite", "jiff", "serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "process", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }
walkdir = "2.5.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
