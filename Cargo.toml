[workspace]
resolver = "3"
members = [
    "crates/xmedia-core",
    "crates/xmedia-book",
    "crates/xmedia-comic",
    "crates/xmedia-music",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
xmedia-core = { path = "crates/xmedia-core" }

aes-gcm = "0.11.1"
argon2 = { version = "0.6.0", features = ["alloc", "getrandom"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart", "macros", "ws"] }
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1.12.1"
chardetng = "1.0.0"
encoding_rs = "0.8.44"
form_urlencoded = "1.2.2"
futures-core = "0.3.32"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "avif"] }
jiff = { version = "0.2.43", features = ["serde"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
lofty = "0.25.5"
lopdf = "0.47.0"
md-5 = "0.11.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toasty = { version = "0.11.0", features = ["sqlite", "postgresql", "mysql", "jiff", "serde"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }
walkdir = "2.5.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate", "bzip2", "zstd"] }
