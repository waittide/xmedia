name: Build Binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAURI_CLI_VERSION: "2.12.6"

jobs:
  build-web:
    name: Build Web SPAs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck & build xmedia-server & xmedia-tool web bundles
        run: |
          pnpm --dir web run typecheck
          pnpm --dir web run build
          pnpm --dir web run build:tool

      - name: Upload frontend dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            web/dist
            web/dist-tool
          if-no-files-found: error
          retention-days: 1

  check-rust:
    name: Clippy & Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: check-rust

      - name: Run Clippy across workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit & integration tests
        run: cargo test --workspace

  build-binaries:
    name: Build CLI (${{ matrix.name }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux
            archive: tar.gz
            ext: ""
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-cross-arm64
            archive: tar.gz
            ext: ""
          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows
            archive: zip
            ext: ".exe"
          - name: macos-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            platform: macos
            archive: tar.gz
            ext: ""
          - name: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-latest
            platform: macos
            archive: tar.gz
            ext: ""
          - name: android-aarch64
            target: aarch64-linux-android
            os: ubuntu-latest
            platform: android
            archive: tar.gz
            ext: ""
          - name: ios-aarch64
            target: aarch64-apple-ios
            os: macos-latest
            platform: ios
            archive: tar.gz
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundles
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web

      - name: Verify embedded frontend assets
        shell: bash
        run: |
          test -f web/dist/index.html
          test -f web/dist-tool/tool.html

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.name }}

      - name: Setup Linux ARM64 cross-compiler
        if: matrix.platform == 'linux-cross-arm64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          {
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - name: Setup macOS deployment target
        if: matrix.platform == 'macos'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Setup Android NDK and libclang
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev clang

          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            echo "::error::Android NDK not found on runner"
            exit 1
          fi

          NDK_TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          ANDROID_API="24"

          # Pair libclang and clang from the exact same toolchain and verify dlopen before building.
          NDK_LIBCLANG_SO="$(find "${NDK_TOOLCHAIN}/lib" "${NDK_TOOLCHAIN}/lib64" -maxdepth 2 -name 'libclang.so*' 2>/dev/null | head -n 1 || true)"
          if [ -n "$NDK_LIBCLANG_SO" ] && [ -x "${NDK_TOOLCHAIN}/bin/clang" ] \
             && python3 -c "import ctypes, sys; ctypes.CDLL(sys.argv[1])" "$NDK_LIBCLANG_SO" 2>/dev/null; then
            LIBCLANG_DIR="$(dirname "$NDK_LIBCLANG_SO")"
            BINDGEN_CLANG_PATH="${NDK_TOOLCHAIN}/bin/clang"
          else
            BINDGEN_CLANG_PATH="$(command -v clang)"
            CLANG_MAJOR="$("${BINDGEN_CLANG_PATH}" -dumpversion | cut -d. -f1)"
            LIBCLANG_DIR="/usr/lib/llvm-${CLANG_MAJOR}/lib"
            if [ -z "$(find "${LIBCLANG_DIR}" -maxdepth 1 -name 'libclang.so*' 2>/dev/null || true)" ]; then
              echo "::error::matching libclang.so for clang ${CLANG_MAJOR} not found in ${LIBCLANG_DIR}"
              exit 1
            fi
          fi

          RESOURCE_DIR="$("${BINDGEN_CLANG_PATH}" -print-resource-dir)"
          BINDGEN_ARGS="--target=aarch64-linux-android${ANDROID_API} --sysroot=${NDK_TOOLCHAIN}/sysroot -resource-dir=${RESOURCE_DIR}"
          echo "Using Android NDK: ${NDK_ROOT} (API ${ANDROID_API})"
          echo "Using libclang: ${LIBCLANG_DIR}, clang: ${BINDGEN_CLANG_PATH}, resource-dir: ${RESOURCE_DIR}"
          printf '#include <stdbool.h>\n#include <stdio.h>\n#include <stdint.h>\n#include <string.h>\n#include <math.h>\n#include <stddef.h>\n#include <inttypes.h>\n#include <limits.h>\n' \
            | "${BINDGEN_CLANG_PATH}" -fsyntax-only -xc ${BINDGEN_ARGS} -

          {
            echo "ANDROID_NDK_HOME=${NDK_ROOT}"
            echo "CC_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
            echo "CXX_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++"
            echo "AR_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
            echo "LIBCLANG_PATH=${LIBCLANG_DIR}"
            echo "CLANG_PATH=${BINDGEN_CLANG_PATH}"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=${BINDGEN_ARGS}"
          } >> "$GITHUB_ENV"

      - name: Setup iOS SDK and libclang
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          XCODE_LIBCLANG="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          XCODE_CLANG="$(xcrun --find clang)"
          echo "Using iOS SDK: ${IOS_SDK}, clang: ${XCODE_CLANG}"
          {
            echo "IPHONEOS_DEPLOYMENT_TARGET=15.0"
            echo "LIBCLANG_PATH=${XCODE_LIBCLANG}"
            echo "CLANG_PATH=${XCODE_CLANG}"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios=--target=arm64-apple-ios15.0 -isysroot ${IOS_SDK}"
          } >> "$GITHUB_ENV"

      - name: Build xmedia-server and xmedia-tool
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --target "${{ matrix.target }}" --bin xmedia-server --bin xmedia-tool 2>&1 | tee cargo-build.log || {
            echo "::error::$(grep -E 'error(\[|:)|panicked at|fatal error|undefined reference|ld\.lld' cargo-build.log | tail -n 12 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }

      - name: Package binaries (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-out
          for bin in xmedia-server xmedia-tool; do
            src="target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}"
            test -f "$src"
            file "$src" || true
            ls -lh "$src"
            stage="dist-stage/${bin}-${{ matrix.name }}"
            mkdir -p "$stage"
            cp "$src" "$stage/"
            cp LICENSE "$stage/"
            tar -C "$stage" -czf "dist-out/${bin}-${{ matrix.name }}.tar.gz" .
          done

      - name: Package binaries (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist-out" | Out-Null
          foreach ($bin in @("xmedia-server", "xmedia-tool")) {
            $src = "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}"
            if (-not (Test-Path $src)) {
              throw "Expected binary not found: $src"
            }
            Get-Item $src | Select-Object Name, Length
            $stage = "dist-stage/${bin}-${{ matrix.name }}"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item $src -Destination $stage
            Copy-Item "LICENSE" -Destination $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "dist-out/${bin}-${{ matrix.name }}.zip" -Force
          }

      - name: Upload packaged CLI binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist-out/*
          if-no-files-found: error

  build-tauri-desktop:
    name: Build App (${{ matrix.name }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux
            cli_asset: cargo-tauri-x86_64-unknown-linux-gnu.tgz
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux
            cli_asset: cargo-tauri-aarch64-unknown-linux-gnu.tgz
          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows
            cli_asset: cargo-tauri-x86_64-pc-windows-msvc.zip
          - name: macos-aarch64
            target: aarch64-apple-darwin
            os: macos-latest
            platform: macos
            cli_asset: cargo-tauri-aarch64-apple-darwin.zip
          - name: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-latest
            platform: macos
            cli_asset: cargo-tauri-aarch64-apple-darwin.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundles
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web

      - name: Verify embedded frontend assets
        shell: bash
        run: test -f web/dist/index.html

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/xmedia-app -> target"
          key: tauri-${{ matrix.name }}

      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            rpm

      - name: Setup macOS deployment target
        if: matrix.platform == 'macos'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Install prebuilt cargo-tauri (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin" /tmp/tauri-cli
          url="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/${{ matrix.cli_asset }}"
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o "/tmp/tauri-cli/${{ matrix.cli_asset }}"
          if [[ "${{ matrix.cli_asset }}" == *.tgz ]]; then
            tar -xzf "/tmp/tauri-cli/${{ matrix.cli_asset }}" -C /tmp/tauri-cli
          else
            unzip -qo "/tmp/tauri-cli/${{ matrix.cli_asset }}" -d /tmp/tauri-cli
          fi
          bin_path="$(find /tmp/tauri-cli -type f -name 'cargo-tauri' | head -n 1)"
          test -n "$bin_path"
          install -m 0755 "$bin_path" "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version

      - name: Install prebuilt cargo-tauri (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:USERPROFILE ".cargo\bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP "tauri-cli"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $zipPath = Join-Path $tmp "${{ matrix.cli_asset }}"
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$($env:TAURI_CLI_VERSION)/${{ matrix.cli_asset }}"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $tmp -Force
          $bin = Get-ChildItem -Path $tmp -Recurse -Filter "cargo-tauri.exe" | Select-Object -First 1
          if (-not $bin) { throw "cargo-tauri.exe not found in archive" }
          Copy-Item $bin.FullName -Destination (Join-Path $dest "cargo-tauri.exe") -Force
          cargo tauri --version

      - name: Disable beforeBuildCommand in CI workspace (uses downloaded web-dist)
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const p = "apps/xmedia-app/tauri.conf.json";
          const data = JSON.parse(fs.readFileSync(p, "utf8"));
          data.build.beforeBuildCommand = "";
          fs.writeFileSync(p, JSON.stringify(data, null, 2) + "\n");
          '

      - name: Build Tauri app (Linux)
        if: matrix.platform == 'linux'
        working-directory: apps/xmedia-app
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          set -o pipefail
          cargo tauri build --target "${{ matrix.target }}" --bundles deb,rpm,appimage 2>&1 | tee tauri-build.log || {
            echo "::error::$(grep -E 'error(\[|:)|Error|failed|panicked at' tauri-build.log | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }

      - name: Build Tauri app (macOS)
        if: matrix.platform == 'macos'
        working-directory: apps/xmedia-app
        shell: bash
        run: |
          set -o pipefail
          cargo tauri build --target "${{ matrix.target }}" --bundles dmg 2>&1 | tee tauri-build.log || {
            echo "::error::$(grep -E 'error(\[|:)|Error|failed|panicked at' tauri-build.log | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows'
        working-directory: apps/xmedia-app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo tauri build --target "${{ matrix.target }}" --bundles msi,nsis

      - name: Collect Tauri desktop bundles (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-out
          bundle_root="apps/xmedia-app/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            deb="$(find "$bundle_root/deb" -maxdepth 2 -name '*.deb' | head -n 1)"
            rpm="$(find "$bundle_root/rpm" -maxdepth 2 -name '*.rpm' | head -n 1)"
            appimage="$(find "$bundle_root/appimage" -maxdepth 2 -name '*.AppImage' | head -n 1)"
            test -n "$deb" && cp "$deb" "dist-out/xmedia-app-${{ matrix.name }}.deb"
            test -n "$rpm" && cp "$rpm" "dist-out/xmedia-app-${{ matrix.name }}.rpm"
            test -n "$appimage" && cp "$appimage" "dist-out/xmedia-app-${{ matrix.name }}.AppImage"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            dmg="$(find "$bundle_root/dmg" -maxdepth 2 -name '*.dmg' | head -n 1)"
            test -n "$dmg"
            cp "$dmg" "dist-out/xmedia-app-${{ matrix.name }}.dmg"
          fi
          ls -lh dist-out/

      - name: Collect Tauri desktop bundles (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist-out" | Out-Null
          $bundleRoot = "apps/xmedia-app/target/${{ matrix.target }}/release/bundle"
          $msi = Get-ChildItem -Path (Join-Path $bundleRoot "msi") -Filter "*.msi" | Select-Object -First 1
          $exe = Get-ChildItem -Path (Join-Path $bundleRoot "nsis") -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $msi) { throw "Expected MSI bundle not found" }
          if (-not $exe) { throw "Expected NSIS setup.exe bundle not found" }
          Copy-Item $msi.FullName -Destination "dist-out/xmedia-app-${{ matrix.name }}.msi"
          Copy-Item $exe.FullName -Destination "dist-out/xmedia-app-${{ matrix.name }}-setup.exe"
          Get-ChildItem dist-out | Select-Object Name, Length

      - name: Upload Tauri desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.name }}
          path: dist-out/*
          if-no-files-found: error

  build-tauri-android:
    name: Build App (android-aarch64)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundles
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web

      - name: Verify embedded frontend assets
        shell: bash
        run: test -f web/dist/index.html

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/xmedia-app -> target"
          key: tauri-android-aarch64

      - name: Install prebuilt cargo-tauri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin" /tmp/tauri-cli
          asset="cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/${asset}" \
            -o "/tmp/tauri-cli/${asset}"
          tar -xzf "/tmp/tauri-cli/${asset}" -C /tmp/tauri-cli
          bin_path="$(find /tmp/tauri-cli -type f -name 'cargo-tauri' | head -n 1)"
          test -n "$bin_path"
          install -m 0755 "$bin_path" "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version

      - name: Setup Android SDK, NDK and libclang
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev clang

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT="$(ls -d "${SDK_ROOT}/ndk/"* 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            echo "::error::Android NDK not found on runner"
            exit 1
          fi

          NDK_TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          ANDROID_API="24"

          NDK_LIBCLANG_SO="$(find "${NDK_TOOLCHAIN}/lib" "${NDK_TOOLCHAIN}/lib64" -maxdepth 2 -name 'libclang.so*' 2>/dev/null | head -n 1 || true)"
          if [ -n "$NDK_LIBCLANG_SO" ] && [ -x "${NDK_TOOLCHAIN}/bin/clang" ] \
             && python3 -c "import ctypes, sys; ctypes.CDLL(sys.argv[1])" "$NDK_LIBCLANG_SO" 2>/dev/null; then
            LIBCLANG_DIR="$(dirname "$NDK_LIBCLANG_SO")"
            BINDGEN_CLANG_PATH="${NDK_TOOLCHAIN}/bin/clang"
          else
            BINDGEN_CLANG_PATH="$(command -v clang)"
            CLANG_MAJOR="$("${BINDGEN_CLANG_PATH}" -dumpversion | cut -d. -f1)"
            LIBCLANG_DIR="/usr/lib/llvm-${CLANG_MAJOR}/lib"
            if [ -z "$(find "${LIBCLANG_DIR}" -maxdepth 1 -name 'libclang.so*' 2>/dev/null || true)" ]; then
              echo "::error::matching libclang.so for clang ${CLANG_MAJOR} not found in ${LIBCLANG_DIR}"
              exit 1
            fi
          fi

          RESOURCE_DIR="$("${BINDGEN_CLANG_PATH}" -print-resource-dir)"
          BINDGEN_ARGS="--target=aarch64-linux-android${ANDROID_API} --sysroot=${NDK_TOOLCHAIN}/sysroot -resource-dir=${RESOURCE_DIR}"
          echo "Using Android SDK: ${SDK_ROOT}, NDK: ${NDK_ROOT} (API ${ANDROID_API})"
          echo "Using libclang: ${LIBCLANG_DIR}, clang: ${BINDGEN_CLANG_PATH}, resource-dir: ${RESOURCE_DIR}"
          printf '#include <stdbool.h>\n#include <stdio.h>\n#include <stdint.h>\n#include <string.h>\n#include <math.h>\n#include <stddef.h>\n#include <inttypes.h>\n#include <limits.h>\n' \
            | "${BINDGEN_CLANG_PATH}" -fsyntax-only -xc ${BINDGEN_ARGS} -

          {
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "ANDROID_NDK_HOME=${NDK_ROOT}"
            echo "NDK_HOME=${NDK_ROOT}"
            echo "CC_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
            echo "CXX_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++"
            echo "AR_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=${NDK_TOOLCHAIN}/bin/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
            echo "LIBCLANG_PATH=${LIBCLANG_DIR}"
            echo "CLANG_PATH=${BINDGEN_CLANG_PATH}"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=${BINDGEN_ARGS}"
          } >> "$GITHUB_ENV"

      - name: Initialize Android project and enable loopback cleartext
        working-directory: apps/xmedia-app
        shell: bash
        run: |
          set -euo pipefail
          python3 -c '
          import json, pathlib
          p = pathlib.Path("tauri.conf.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["build"]["beforeBuildCommand"] = ""
          p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          '
          cargo tauri android init --ci
          cargo tauri icon icons/icon.png
          python3 scripts/configure_android.py

      - name: Build Android APK (aarch64)
        working-directory: apps/xmedia-app
        shell: bash
        run: |
          set -o pipefail
          cargo tauri android build --apk --target aarch64 2>&1 | tee tauri-android.log || {
            echo "::error::$(grep -E 'error(\[|:)|Error|FAILURE|FAILED|panicked at' tauri-android.log | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }

      - name: Align and sign Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist-out /tmp/apk-sign
          raw_apk="$(find apps/xmedia-app/gen/android/app/build/outputs/apk -type f -name '*arm64*release*.apk' | head -n 1 || true)"
          if [ -z "$raw_apk" ]; then
            raw_apk="$(find apps/xmedia-app/gen/android/app/build/outputs/apk -type f -name '*release*.apk' | head -n 1)"
          fi
          test -n "$raw_apk"
          echo "Found raw APK: ${raw_apk}"

          build_tools="$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)"
          aligned_apk="/tmp/apk-sign/aligned.apk"
          "${build_tools}/zipalign" -f -p 4 "$raw_apk" "$aligned_apk"

          keystore="/tmp/apk-sign/release.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$keystore"
            ks_pass="${ANDROID_KEYSTORE_PASSWORD}"
            key_alias="${ANDROID_KEY_ALIAS}"
            key_pass="${ANDROID_KEY_PASSWORD:-$ks_pass}"
          else
            ks_pass="xmedia-ci-keystore"
            key_alias="xmedia"
            key_pass="$ks_pass"
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -storepass "$ks_pass" \
              -keypass "$key_pass" \
              -alias "$key_alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=XMedia, O=XMedia, L=Internet, C=US"
          fi

          out_apk="dist-out/xmedia-app-android-aarch64.apk"
          "${build_tools}/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:${ks_pass}" \
            --ks-key-alias "$key_alias" \
            --key-pass "pass:${key_pass}" \
            --out "$out_apk" \
            "$aligned_apk"
          "${build_tools}/apksigner" verify "$out_apk"
          ls -lh "$out_apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-aarch64
          path: dist-out/*
          if-no-files-found: error

  build-tauri-ios:
    name: Build App (ios-aarch64)
    needs: build-web
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundles
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web

      - name: Verify embedded frontend assets
        shell: bash
        run: test -f web/dist/index.html

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/xmedia-app -> target"
          key: tauri-ios-aarch64

      - name: Install prebuilt cargo-tauri and xcodegen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin" /tmp/tauri-cli
          asset="cargo-tauri-aarch64-apple-darwin.zip"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/${asset}" \
            -o "/tmp/tauri-cli/${asset}"
          unzip -qo "/tmp/tauri-cli/${asset}" -d /tmp/tauri-cli
          bin_path="$(find /tmp/tauri-cli -type f -name 'cargo-tauri' | head -n 1)"
          test -n "$bin_path"
          install -m 0755 "$bin_path" "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Setup iOS SDK and libclang
        shell: bash
        run: |
          set -euo pipefail
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          XCODE_LIBCLANG="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          XCODE_CLANG="$(xcrun --find clang)"
          echo "Using iOS SDK: ${IOS_SDK}, clang: ${XCODE_CLANG}"
          {
            echo "IPHONEOS_DEPLOYMENT_TARGET=15.0"
            echo "LIBCLANG_PATH=${XCODE_LIBCLANG}"
            echo "CLANG_PATH=${XCODE_CLANG}"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios=--target=arm64-apple-ios15.0 -isysroot ${IOS_SDK}"
          } >> "$GITHUB_ENV"

      - name: Initialize iOS project and enable local networking
        working-directory: apps/xmedia-app
        shell: bash
        run: |
          set -euo pipefail
          python3 -c '
          import json, pathlib
          p = pathlib.Path("tauri.conf.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["build"]["beforeBuildCommand"] = ""
          p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          '
          cargo tauri ios init --ci
          cargo tauri icon icons/icon-ios.png --ios-color "#1646B5"
          for plist in gen/apple/*/Info.plist; do
            test -f "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          done

      - name: Build unsigned iOS IPA (aarch64)
        working-directory: apps/xmedia-app
        shell: bash
        run: |
          set -euo pipefail
          cargo tauri ios build --ci --no-sign --target aarch64 2>&1 | tee tauri-ios.log || {
            echo "::error::$(tail -n 30 tauri-ios.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }

          ipa_file="$(find gen/apple/build -type f -name '*.ipa' | head -n 1 || true)"
          if [ -z "$ipa_file" ]; then
            echo "::error::Expected unsigned IPA under gen/apple/build not found"
            find gen/apple/build -maxdepth 4 || true
            exit 1
          fi
          mkdir -p ../../dist-out
          cp "$ipa_file" ../../dist-out/xmedia-app-ios-aarch64-unsigned.ipa
          ls -lh ../../dist-out/xmedia-app-ios-aarch64-unsigned.ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-ios-aarch64
          path: dist-out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs:
      - check-rust
      - build-binaries
      - build-tauri-desktop
      - build-tauri-android
      - build-tauri-ios
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release-assets

      - name: Download all Tauri app artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          merge-multiple: true
          path: release-assets

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Remove legacy xmedia-* assets on existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'); do
              if [[ "$asset" =~ ^xmedia-(linux|windows|macos|android|ios)- ]]; then
                echo "Deleting legacy asset: $asset"
                gh release delete-asset "$TAG" "$asset" --repo "${{ github.repository }}" --yes || true
              fi
            done
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
