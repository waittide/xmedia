<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebeef3" />
    <title>xmedia-tool — 原文件刮削与元信息整理工作台</title>
    <script>
      try{var p=JSON.parse(localStorage.getItem('xmedia.preferences')||'{}'),m=p.theme_mode||'system',d=m==='dark'||(m!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d){document.documentElement.dataset.theme='dark';var mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content='#1d2023'}}catch(e){}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/tool/main.ts"></script>
  </body>
</html>
